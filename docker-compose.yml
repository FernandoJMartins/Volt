services:
  # O banco usado é o Postgres LOCAL da maquina (ver DATABASE_URL no .env,
  # apontando para host.docker.internal). Este servico ficou como alternativa:
  # suba com `docker compose --profile db up -d` se quiser um Postgres em container.
  postgres:
    profiles: ["db"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ifpb
      POSTGRES_DB: xpanel
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # IA LOCAL (gratis): servidor Ollama na propria maquina. Depois de subir,
  # puxe um modelo: docker compose exec ollama ollama pull qwen2.5:7b
  # (use llama3.2:3b em maquinas com pouca RAM; ver README).
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

  api:
    build: ./backend
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    # Chromium precisa de shm maior; o padrao de 64MB derruba o navegador.
    shm_size: "1gb"
    volumes:
      - ./backend:/srv
      - media:/data/media
      - sessions:/data/sessions
    ports:
      # host 8010 -> container 8000 (8000 estava ocupado na maquina)
      - "8010:8000"
    # Linux nao resolve host.docker.internal por padrao (isso e coisa do Docker Desktop).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis: { condition: service_healthy }

  worker:
    build: ./backend
    env_file: .env
    command: arq app.workers.WorkerSettings
    shm_size: "1gb"
    volumes:
      - ./backend:/srv
      - media:/data/media
      - sessions:/data/sessions
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis: { condition: service_healthy }

  scheduler:
    build: ./backend
    env_file: .env
    command: python -m app.scheduler
    restart: unless-stopped
    volumes:
      - ./backend:/srv
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis: { condition: service_healthy }

  frontend:
    build: ./frontend
    ports:
      # host 5180 -> container 5173 (5173 estava ocupado na maquina)
      - "5180:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
  media:
  sessions:
  ollama:
